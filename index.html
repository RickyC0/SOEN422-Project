<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Plant Dashboard</title>
    <style>
        /* --- CSS STYLING --- */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #03dac6; margin-bottom: 30px; }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background-color: #1e1e1e;
            border-radius: 15px;
            padding: 20px;
            width: 300px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }
        .card:hover { transform: translateY(-5px); border-color: #03dac6; }
        .label { font-size: 1.1rem; color: #bbbbbb; margin-bottom: 10px; }
        .value { font-size: 3rem; font-weight: bold; margin: 10px 0; }
        .status { font-size: 1rem; padding: 5px 10px; border-radius: 5px; display: inline-block; }


        /*Cam feed */
        .cam-feed {
            width: 100%;
            height: 200px;
            object-fit: cover; /* Crops image */
            border-radius: 10px;
            border: 2px solid #333;
            margin-bottom: 15px;
            background-color: #000;
        }

        /* Dynamic Colors */
        .good { color: #03dac6; }
        .bad { color: #cf6679; }
        .on { background-color: #03dac6; color: black; font-weight: bold; }
        .off { background-color: #333; color: #777; }

        .timestamp { font-size: 0.8rem; color: #555; margin-top: 40px; }
    </style>
</head>
<body>

    <div id="swarm-container" class="container">
        
    </div>

    <div class="timestamp">Live Data from Firebase Realtime Database</div>

    <script type="module">
        // Import Firebase SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";        
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        

        // CONFIG 
        const firebaseConfig = {
            apiKey: "AIzaSyAoUInnpxkWkLnkLTI18t7BGXFgapRXAow",
            authDomain: "esp32-plant-care.firebaseapp.com",
            databaseURL: "https://esp32-plant-care-default-rtdb.firebaseio.com",
            projectId: "esp32-plant-care",
            storageBucket: "esp32-plant-care.firebasestorage.app",
            messagingSenderId: "751775175230",
            appId: "1:751775175230:web:90a308849a5a1883f5f76f"
        };

        // Initialize firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const swarmRef = ref(db, 'plants');

        // LISTEN TO THE PARENT FOLDER for all plants
        onValue(swarmRef, (snapshot) => {
            const allPlants = snapshot.val();
            
            if (allPlants) {
                // Loop through every plant found in the database
                Object.keys(allPlants).forEach(plantId => {
                    const plantData = allPlants[plantId];
                    updatePlantCard(plantId, plantData);
                });
            }
        });

        const actuatorsHTML = `
            <div style="margin-top:20px; display:flex; flex-direction:column; gap:10px;">
                <div style="display:flex; justify-content:space-between; align-items:center; background:#2a2a2a; padding:10px; border-radius:8px;">
                    <div style="text-align:left;">
                        <div class="label" style="font-size:0.9rem; margin:0;">Pump</div>
                        <span id="${id}-pump" class="status off">OFF</span>
                    </div>
                    <button onclick="togglePump('${id}')" style="background:#03dac6; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; font-weight:bold;">
                        WATER PLANT
                    </button>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; background:#2a2a2a; padding:10px; border-radius:8px;">
                    <div style="text-align:left;">
                        <div class="label" style="font-size:0.9rem; margin:0;">Grow Light</div>
                        <span id="${id}-led" class="status off">OFF</span>
                    </div>
                    <button onclick="toggleLight('${id}')" style="background:#ffb74d; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; font-weight:bold;">
                        TOGGLE LIGHT
                    </button>
                </div>
            </div>
        `;

        function updatePlantCard(id, data) {
            // Check if a card for this plant already exists
            let card = document.getElementById(id);

            if (!card) {
                // If not, create it
                card = document.createElement('div');
                card.id = id;
                card.className = 'card';

                const imgUrl = `https://firebasestorage.googleapis.com/v0/b/${firebaseConfig.storageBucket}/o/plant_photos%2F${id}.jpg?alt=media`;
                
                card.innerHTML = actuatorsHTML.replace(/\${id}/g, id);
                
                // Add to the main container
                document.getElementById('swarm-container').appendChild(card);
            }

            // --- UPDATE VALUES ---
            // update the specific IDs for this plant
            
            // Moisture Logic
            const moistEl = document.getElementById(`${id}-moist-val`);
            const moistStatus = document.getElementById(`${id}-moist-status`);
            moistEl.innerText = data.Moisture + "%";
            
            if (data.Moisture < 30) {
                moistEl.className = "value bad";
                moistStatus.innerText = "Needs Water";
                moistStatus.className = "status bad";
            } else {
                moistEl.className = "value good";
                moistStatus.innerText = "Healthy";
                moistStatus.className = "status good";
            }

            // Light Logic
            const lightLabels = ["Dark", "Dim", "Normal", "Bright", "Very Bright"];
            document.getElementById(`${id}-light-val`).innerText = lightLabels[data.Light] || "Unknown";

            // Actuators
            const pumpEl = document.getElementById(`${id}-pump`);
            pumpEl.innerText = data.PumpState;
            pumpEl.className = (data.PumpState === "ON") ? "status on" : "status off";

            const ledEl = document.getElementById(`${id}-led`);
            ledEl.innerText = data.LightState;
            ledEl.className = (data.LightState === "ON") ? "status on" : "status off";

            const imgEl = document.getElementById(`${id}-cam`);
            const baseUrl = `https://firebasestorage.googleapis.com/v0/b/${firebaseConfig.storageBucket}/o/plant_photos%2F${id}.jpg?alt=media`;
            imgEl.src = baseUrl + `&t=${Date.now()}`; // Cache buster to force refresh
        }
    </script>
</body>

<script>
    import { update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    window.togglePump = function(plantId) {
        console.log("Triggering Pump for", plantId);
        // Write "true" to the specific command path
        const updates = {};
        updates[`plants/${plantId}/commands/pump`] = true;
        update(ref(db), updates);
    };

    window.toggleLight = function(plantId) {
        console.log("Toggling Light for", plantId);
        // We send a "toggle" command. The ESP32 will handle the logic.
        const updates = {};
        updates[`plants/${plantId}/commands/lightToggle`] = true;
        update(ref(db), updates);
    };
</script>
</html>
